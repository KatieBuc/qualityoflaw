experiment_name: first-full-run

concurrency:
  enabled: true
  max_workers: 20

translation:
  model: claude-sonnet-4-5
  prompt_version: v2
  chunking:
    enabled: true
    safe_limit: 32000

# Markdown-in / Markdown-out translation (the default path). Reuses
# translation.model and translation_qa.model; target_chars is what packs
# heading sections into translation units.
translation_markdown:
  prompt_version: v3
  qa_prompt_version: v2
  # translation_qa_md re-audits each chunk until the auditor reports no
  # remaining problems, up to this many passes.
  qa_max_passes: 2
  chunking:
    target_chars: 8000
    safe_limit: 32000

translation_qa:
  model: gpt-5.2-translation-qa
  prompt_version: v1

evaluation:
  model: gpt-5.2
  prompt_version: v4
  method: rag  # "rag" | "sliding_window"
  # Per-indicator confidence. `logprobs` and `margin` ride along on the
  # evaluation call for free; `verbalized` asks the judge to rate itself and
  # requires prompt_version: v4. `primary` picks which score drives the
  # comparison report's headline coverage; every enabled method is recorded
  # and scored side by side regardless.
  # Deployments that reject logprobs degrade to confidence: null, with one warning.
  confidence:
    enabled: true
    methods: [logprobs, verbalized, margin]   # + verbalized (needs prompt_version: v4)
    primary: margin
    # Alternatives requested per answer token, which is what margin reads.
    # Azure caps this at 5; a higher value is detected and clamped at runtime
    # rather than costing the run its logprobs.
    top_logprobs: 5
  sliding_window:
    prompt_version: sliding_window_v1
    window_sentences: 100
    overlap_sentences: 15
  rag:
    enabled: true
    storage:
      batch_size: 16
    retrieval:
      top_k: 10
      hybrid_bm25:
        enabled: true
        rrf_k: 60
      reranker:
        enabled: true
        model: cohere-rerank-v4.0-fast
        candidate_pool_size: 125
        top_k: 25
      evidence_verification:
        enabled: true

comparison:
  # Cutoffs for confidence_report.json. Predictions below a cutoff count as
  # "low confidence"; coverage_rate is the share of actual errors they capture.
  confidence:
    thresholds: [0.5, 0.7, 0.9, 0.95, 0.99]
    quantiles: [0.05, 0.10, 0.20, 0.30]
    primary_threshold: 0.9
    flagged_sample_size: 100
    calibration_bins: 10

discrepancy_diagnosis:
  model: gpt-5.2-diagnosis
  prompt_version: v1

paths:
  # Raw OCR text: still the source of truth for discrepancy_diagnosis, and the
  # input to the legacy raw-text translation path.
  input_dir: data/raw/localpolicies
  # Curated Markdown corpus: the input to translation_md.
  markdown_input_dir: data/processed/localpolicies/cleaned_markdown
  golden_csv: data/processed/long_policy_encoding.csv
  index_schema: data/mapping/index_schema.yaml
